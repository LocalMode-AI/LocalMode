<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="LocalMode — 15 npm packages, 107 UI components, 37 blocks, 76 chat models, 64 React hooks.">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="440" rx="20" fill="url(#bg2)"/>
  <rect width="1280" height="440" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="440" rx="20" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1278" height="438" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Brand mark + wordmark -->
  <g>
    <rect x="512" y="40" width="76" height="76" rx="18" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.16"/>
    <g transform="translate(529,57) scale(1.75)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="m2 2 20 20"/>
      <path d="M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-.193"/>
      <path d="M21.532 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7.008 7.008 0 0 0 10 5.07"/>
    </g>
    <text x="604" y="94" font-size="52" font-weight="800" fill="#ffffff">LocalMode</text>
  </g>

  <text x="640" y="156" font-size="21" text-anchor="middle" fill="#94a3b8">Run ML models entirely in your browser. No servers. No API keys. Your data never leaves the device.</text>

  <!-- Stat row -->
  <g text-anchor="middle">
    <!-- dividers between the evenly-spaced stats -->
    <g stroke="#ffffff" stroke-opacity="0.10">
      <line x1="276" y1="214" x2="276" y2="300"/>
      <line x1="519" y1="214" x2="519" y2="300"/>
      <line x1="761" y1="214" x2="761" y2="300"/>
      <line x1="1004" y1="214" x2="1004" y2="300"/>
    </g>
    <g font-weight="800" font-size="46" fill="url(#num)">
      <text x="155" y="272">15</text>
      <text x="398" y="272">107</text>
      <text x="640" y="272">37</text>
      <text x="882" y="272">76</text>
      <text x="1125" y="272">64</text>
    </g>
    <g font-size="14.5" fill="#8091a7" font-weight="500">
      <text x="155" y="298">npm packages</text>
      <text x="398" y="298">UI components</text>
      <text x="640" y="298">blocks</text>
      <text x="882" y="298">chat models</text>
      <text x="1125" y="298">React hooks</text>
    </g>
  </g>

  <!-- Guarantee pills -->
  <g text-anchor="start" font-size="14" font-weight="600" fill="#cbd5e1">
    <g transform="translate(437,352)">
      <rect x="0" y="-18" width="150" height="36" rx="18" fill="#111c31" stroke="#2b3a55"/>
      <circle cx="16" cy="0" r="4" fill="#22c55e"/>
      <text x="30" y="5">100% on-device</text>
    </g>
    <g transform="translate(601,352)">
      <rect x="0" y="-18" width="89" height="36" rx="18" fill="#111c31" stroke="#2b3a55"/>
      <circle cx="16" cy="0" r="4" fill="#22c55e"/>
      <text x="30" y="5">offline</text>
    </g>
    <g transform="translate(704,352)">
      <rect x="0" y="-18" width="140" height="36" rx="18" fill="#111c31" stroke="#2b3a55"/>
      <circle cx="16" cy="0" r="4" fill="#22c55e"/>
      <text x="30" y="5">zero telemetry</text>
    </g>
  </g>

  <!-- Install one-liner -->
  <text class="mono" x="640" y="416" font-size="14.5" text-anchor="middle"><tspan fill="#64748b">$</tspan> <tspan fill="#93c5fd">npm i</tspan> <tspan fill="#cbd5e1">@localmode/core @localmode/transformers</tspan></text>
</svg>
